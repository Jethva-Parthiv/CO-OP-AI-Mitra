services:
  - type: web
    name: coop-mitra-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVE_MODEL_NAME
        value: gemini-3.1-flash-live-preview
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: CHROMA_PERSIST_DIR
        value: data/chroma_db
      - key: POLICIES_DIR
        value: data/policies
